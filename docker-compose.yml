services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: backend_laravel

    ports:
      - "8000:80"

    volumes:
      - ./app:/var/www/html/app
      - ./routes:/var/www/html/routes
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
      - ./config:/var/www/html/config
      - ./composer.json:/var/www/html/composer.json
      - ./composer.lock:/var/www/html/composer.lock

    depends_on:
      - mysql
      - mongodb

    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: aprendiz
      DB_USERNAME: root
      DB_PASSWORD: root
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: aprendiz_logs


  mysql:
    image: mysql:8.0
    container_name: mysql_aprendiz
    restart: always

    environment:
      MYSQL_DATABASE: aprendiz
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql


  mongodb:
    image: mongo:latest
    container_name: mongodb_aprendiz
    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db


volumes:
  mysql_data:
  mongo_data: