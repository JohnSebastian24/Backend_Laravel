services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: backend_laravel

    ports:
      - "8000:80"

    volumes:
      - ./app:/var/www/html/app
      - ./routes:/var/www/html/routes
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
      - ./config:/var/www/html/config
      - ./composer.json:/var/www/html/composer.json
      - ./composer.lock:/var/www/html/composer.lock

    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: aprendiz
      DB_USERNAME: postgres
      DB_PASSWORD: root

      MONGO_URI: "mongodb://mongodb:27017"
      MONGO_DATABASE: aprendiz_logs


  postgres:
    image: postgres:16
    container_name: postgres_aprendiz
    restart: always

    environment:
      POSTGRES_DB: aprendiz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aprendiz"]
      interval: 5s
      timeout: 5s
      retries: 10


  mongodb:
    image: mongo:latest
    container_name: mongodb_aprendiz
    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db


volumes:
  postgres_data:
  mongo_data: